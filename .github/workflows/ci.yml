name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: finance_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_LOG_DIRS: /var/lib/kafka/data
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_NUM_PARTITIONS: "3"
          KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
          KAFKA_MIN_INSYNC_REPLICAS: "1"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-start-period 30s
          --health-retries 20
    env:
      FINANCE_TEST_DATABASE_URL: postgresql+psycopg://finance_test:ci-test-only@localhost:5432/finance_agent_test
      FINANCE_TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,cache,documents,kafka]"

      # 不需要模型 API key：LLM 调用打桩，持久化与事件集成测试使用
      # 上方隔离的 PostgreSQL/Kafka 服务，避免关键 broker 测试只被跳过。
      - name: 跑测试
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Isolated CI project/volumes, never the local developer deployment.
      COMPOSE_PROJECT_NAME: finance-agent-ci
      FINANCE_DB_PASSWORD: 'ci-only:@/#$?-password'
      FINANCE_WEB_TOKEN: ci-smoke-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查容器配置并构建启动
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.kafka.yaml config --quiet
          docker compose up --build -d

      - name: 验证独立任务与持久化
        run: |
          python scripts/docker_smoke.py --phase exercise
          test "$(docker compose exec -T api id -u)" = "10001"
          docker compose exec -T api python -c "import pymupdf, pptx, rapidocr_onnxruntime, chromadb, confluent_kafka"
          docker compose restart api
          python scripts/docker_smoke.py --phase verify

      - name: 失败时输出容器状态和日志
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=150

      - name: 清理本次 CI 的隔离容器与卷
        if: always()
        run: docker compose down --volumes --remove-orphans
