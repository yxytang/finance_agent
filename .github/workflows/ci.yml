name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 不需要 API key：测试只覆盖确定性层（金额、CSV 读入、生成器、
      # skill 解析、Session 的那些不变量），所有 LLM 调用都打桩。
      - name: 跑测试
        run: python -m pytest -q
