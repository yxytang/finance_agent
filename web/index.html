<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finance_agent</title>
<!--
  单文件、零构建、原生 JS。

  唯一的外部依赖是 Chart.js 的 CDN —— 离线时图不会出，但对话照常。
  这是刻意的取舍：把 Chart.js 那份几百 KB 塞进这个文件，会让它没法读。

  ## 这个界面和普通聊天界面的区别

  普通聊天是「问 → 等两秒 → 出答案」。这个 agent 一轮要跑几十秒，中间有多次
  工具往返。所以界面必须**把过程显示出来** —— 用户要能判断它是不是走偏了，
  而不是盯着一个转圈的图标等四十秒然后拿到一个不知道从哪来的数字。

  所以工具调用是**一等公民**，不是收起来的调试信息。
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3038;
    --fg: #dfe3ea; --dim: #8b93a1; --accent: #6aa9ff;
    --ok: #4ec9a0; --warn: #e0a458; --bad: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; height: 100vh;
  }
  /* 侧栏是**会话列表**，不是导航 —— 它存在的理由是服务端留了回放，
     而之前没有任何入口能走回去（刷新就开新会话）。 */
  #sidebar {
    width: 212px; flex: none; border-right: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; overflow: hidden;
  }
  .side-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim);
  }
  .side-head button { margin-left: auto; padding: 2px 10px; }
  #sessions { flex: 1; overflow-y: auto; padding: 6px; }
  .session {
    display: block; width: 100%; text-align: left; margin-bottom: 3px;
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; font-size: 13px;
  }
  .session:hover { background: #232833; }
  .session.active { background: #22303f; border-color: #3c5f85; }
  .session .sid { display: block; font-family: ui-monospace, Consolas, monospace; }
  .session .meta { display: block; color: var(--dim); font-size: 11px; margin-top: 1px; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  #status.on { color: var(--ok); }
  #status.off { color: var(--bad); }
  button {
    background: #2a3038; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #333a44; }
  button:disabled { opacity: .45; cursor: default; }

  main { flex: 1; overflow-y: auto; padding: 18px 16px 8px; }
  .wrap { max-width: 820px; margin: 0 auto; }

  .msg { margin-bottom: 16px; }
  .msg.user {
    background: #22303f; border-radius: 10px; padding: 8px 13px;
    margin-left: auto; max-width: 78%; width: fit-content;
  }
  .msg.answer { background: var(--panel); border-radius: 10px; padding: 12px 15px; }
  .msg.answer :first-child { margin-top: 0; }
  .msg.answer :last-child { margin-bottom: 0; }
  .msg.answer table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
  .msg.answer th, .msg.answer td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  .msg.answer th { background: #232833; }
  .msg.answer code { background: #232833; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg.answer pre { background: #232833; padding: 10px; border-radius: 6px; overflow-x: auto; }
  .msg.answer pre code { background: none; padding: 0; }
  .msg.answer ul, .msg.answer ol { margin: 8px 0; padding-left: 22px; }
  .msg.answer li { margin: 3px 0; }
  .msg.answer blockquote {
    margin: 8px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--line); color: var(--dim);
  }
  .msg.answer a { color: var(--accent); }

  .tool {
    border-left: 2px solid var(--line); margin: 7px 0 7px 4px; padding: 3px 0 3px 12px;
    font-size: 13px;
  }
  .tool .head { display: flex; gap: 8px; align-items: baseline; }
  .tool .name { color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
  .tool .args { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .out {
    color: var(--dim); font-family: ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
    max-height: 3.3em; overflow: hidden; cursor: pointer; margin-top: 2px;
  }
  .tool .out.open { max-height: 26em; overflow-y: auto; }
  .tool.failed .name { color: var(--bad); }
  .tool .chart { margin-top: 8px; max-width: 620px; }
  .tool .chart-note { font-size: 12px; color: var(--warn); margin-bottom: 5px; }

  .note {
    border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 10px 0;
    background: #2a2529; color: var(--warn); border: 1px solid #3d3438;
  }
  .note.bad { background: #2c2224; color: var(--bad); border-color: #46302f; }
  .note.dim { background: #22262c; color: var(--dim); border-color: var(--line); }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 9px; }
  textarea {
    flex: 1; resize: none; background: #14171c; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font: inherit; height: 46px; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; max-width: 440px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog p { margin: 0 0 14px; }
  dialog .row { display: flex; gap: 9px; justify-content: flex-end; }
  dialog button.primary { background: #2d4a6b; border-color: #3c5f85; }
  .hint { color: var(--dim); font-size: 12px; max-width: 820px; margin: 7px auto 0; }

  /* 窄屏：侧栏从左边挪到上面。212px 的固定宽度在手机上会把对话挤成一条细缝，
     而对话才是这个界面的主体。 */
  @media (max-width: 720px) {
    body { flex-direction: column; }
    #sidebar {
      width: 100%; max-height: 26vh;
      border-right: none; border-bottom: 1px solid var(--line);
    }
    header { padding: 8px 12px; }
    main { padding: 12px 10px 6px; }
    footer { padding: 10px 12px; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-head">
    <span>会话</span>
    <button id="new" title="开一个新会话">＋</button>
  </div>
  <div id="sessions"></div>
</aside>

<div class="pane">
  <header>
    <h1>finance_agent</h1>
    <span id="status">连接中…</span>
  </header>

  <main><div class="wrap" id="log"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" class="primary" style="background:#2d4a6b;border-color:#3c5f85">发送</button>
    </div>
    <div class="hint">工具调用会实时显示 —— 这样你能看出它有没有走偏，而不是干等一个数字。</div>
  </footer>
</div>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="row">
    <button id="deny">拒绝</button>
    <button id="allow" class="primary">允许</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");

let sessionId = null;
let source = null;
let busy = false;
let current = null;   // 正在渲染的那条 assistant 气泡
let sessions = [];    // 服务端认得的会话，最近活动的在前

// --- 工具 ---------------------------------------------------------------

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

function setStatus(text, cls) {
  $("status").textContent = text;
  $("status").className = cls || "";
}

function setBusy(value) {
  busy = value;
  $("send").disabled = value;
  $("input").disabled = value;
  if (!value) $("input").focus();
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// --- 会话 ---------------------------------------------------------------

// 会话 id 存两处，缺一不可：
//   · localStorage —— 刷新之后还认得
//   · URL hash     —— 开两个标签页时，各自 URL 里的那个才是对的
// 只存 localStorage 的话两个标签页会互相踩：后开的把前一个的 id 盖掉，
// 前一个一刷新就跳到别人的会话去了。
const STORE_KEY = "fa.session";

function remember(id) {
  sessionId = id;
  // 无痕模式下 localStorage 会抛。存不进去不影响这次能用，只是刷新后回不来。
  try { localStorage.setItem(STORE_KEY, id); } catch (err) { /* 忽略 */ }

  const url = new URL(location.href);
  url.hash = id;
  history.replaceState(null, "", url);
}

function recall() {
  const fromUrl = decodeURIComponent(location.hash.slice(1));
  if (fromUrl) return fromUrl;
  try { return localStorage.getItem(STORE_KEY); } catch (err) { return null; }
}

function openSession(id) {
  if (source) source.close();
  log.innerHTML = "";
  current = null;
  setBusy(false);
  remember(id);
  connect();
  renderList();
}

async function refreshList() {
  try {
    sessions = (await api("/api/sessions")).sessions;
  } catch (err) {
    // 列表拉不到不该挡住聊天 —— 顶多是侧栏空着。
    console.warn("会话列表拉不到", err);
    return;
  }
  renderList();
}

function when(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "刚刚";
  if (mins < 60) return mins + " 分钟前";
  if (mins < 1440) return Math.round(mins / 60) + " 小时前";
  return new Date(iso).toLocaleDateString();
}

function renderList() {
  const box = $("sessions");
  box.innerHTML = "";
  for (const item of sessions) {
    const node = el("button", "session" + (item.id === sessionId ? " active" : ""));
    node.appendChild(el("span", "sid", item.id.slice(0, 8)));
    node.appendChild(
      el("span", "meta",
         item.turns + " 轮 · " + (item.busy ? "进行中" : when(item.last_activity)))
    );
    node.onclick = () => openSession(item.id);
    box.appendChild(node);
  }
}

async function newSession() {
  try {
    const { id } = await api("/api/sessions", {});
    openSession(id);
    await refreshList();
  } catch (err) {
    setStatus("开不了会话：" + err.message, "off");
  }
}

async function boot() {
  await refreshList();

  // **先在列表里确认这个 id 还在，再连。** 服务一重启所有会话就都没了，
  // 这时候拿旧 id 去连会一直 404 —— 而 EventSource 会自动重连一个永远不
  // 成功的地址，界面看起来就是卡住了，且没有任何报错。
  const wanted = recall();
  if (wanted && sessions.some((item) => item.id === wanted)) {
    openSession(wanted);
  } else {
    await newSession();
  }
}

function connect() {
  source = new EventSource(`/api/sessions/${sessionId}/events`);
  source.onopen = () => setStatus("已连接", "on");
  source.onerror = () => {
    // EventSource 自己会重连，所以这里不关它 —— 只把状态显示出来，
    // 免得用户对着一个看起来正常的界面等一个永远不会来的回复。
    setStatus("断开，重连中…", "off");
  };
  source.onmessage = (e) => {
    try {
      render(JSON.parse(e.data));
    } catch (err) {
      console.error("事件解析失败", e.data, err);
    }
  };
}

// --- 渲染 ---------------------------------------------------------------

function bubble(cls) {
  const node = el("div", "msg " + cls);
  log.appendChild(node);
  return node;
}

function scroll() { log.parentElement.scrollTop = log.parentElement.scrollHeight; }

function render(ev) {
  switch (ev.type) {
    case "connected":
      setStatus("已连接", "on");
      break;

    case "turn_start":
      bubble("user", ev.text);
      current = bubble("answer");
      setBusy(true);
      break;

    case "turn_end":
      current = null;
      setBusy(false);
      refreshList();   // 轮数变了，侧栏跟着更新
      break;

    case "step_start":
      // 步号不显示 —— 它对人没有意义，工具调用本身就说明了在干什么。
      break;

    case "tool_call":
      addTool(ev);
      break;

    case "tool_result":
      fillTool(ev);
      break;

    case "chart":
      addChart(ev);
      break;

    case "answer":
      if (current) current.innerHTML = markdown(ev.text);
      break;

    case "error":
      (current || bubble("answer")).appendChild(el("div", "note bad", ev.message));
      break;

    case "confirm_request":
      askConfirm(ev.summary);
      break;

    case "confirm_timeout":
      (current || bubble("answer")).appendChild(el("div", "note", ev.message));
      break;
  }
  scroll();
}

// 工具卡片按 call_id 索引，这样结果回来时能找到发起它的那一行。
const toolCards = {};

function addTool(ev) {
  const card = el("div", "tool");
  card.dataset.call = ev.call_id;

  const head = el("div", "head");
  head.appendChild(el("span", "name", "→ " + ev.name));
  head.appendChild(el("span", "args", JSON.stringify(ev.args)));
  card.appendChild(head);

  (current || bubble("answer")).appendChild(card);
  toolCards[ev.call_id] = card;
}

function fillTool(ev) {
  const card = toolCards[ev.call_id] || (current || bubble("answer"));
  if (!ev.ok) card.classList.add("failed");

  const out = el("div", "out", ev.content);
  out.onclick = () => out.classList.toggle("open");
  out.title = "点一下展开/收起";
  card.appendChild(out);
}

function addChart(ev) {
  const card = toolCards[ev.call_id];
  if (!card || typeof Chart === "undefined") return;

  // 预测图**必须一眼看出来是预测**。推算值和实测值长得一模一样，而图里只有一串
  // 数字 —— 不标的话用户会把推算读成实际发生额。那正是这个项目最防的一类错误：
  // 没有报错、看着合理、但它是错的。
  const projected = ev.kind === "projected";

  const box = el("div", "chart");
  if (projected) {
    box.appendChild(el("div", "chart-note", "预计 —— 这张图含推算值，不是账单里的数"));
  }
  const canvas = el("canvas");
  box.appendChild(canvas);
  card.appendChild(box);

  // 长标签（商户名）用横向柱状图，纵向的话标签会挤成一团。
  const byValue = ev.order === "数值";
  const rows = ev.rows.slice(0, 10);
  const palette = ["#6aa9ff", "#4ec9a0", "#e0a458", "#e06c75", "#a78bfa",
                   "#38bdf8", "#f472b6", "#facc15", "#34d399", "#fb923c"];
  // 预测用警示色 + 描边空心柱，和实测的实心柱区分开。
  const accent = projected ? "#e0a458" : "#6aa9ff";

  new Chart(canvas, {
    type: byValue ? "bar" : "line",
    data: {
      labels: rows.map((r) => r.label),
      datasets: [{
        label: (byValue ? "金额" : "支出") + "（" + ev.group + "）" + (projected ? "·推算" : ""),
        data: rows.map((r) => r.value),
        backgroundColor: byValue
          ? (projected ? accent + "22" : rows.map((_, i) => palette[i % palette.length]))
          : accent + "33",
        borderColor: projected ? accent : "#6aa9ff",
        borderWidth: byValue ? (projected ? 2 : 0) : 2,
        fill: !byValue,
        tension: 0.25,
      }],
    },
    options: {
      indexAxis: byValue ? "y" : "x",
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const row = rows[ctx.dataIndex];
              const amount = row.value.toLocaleString();
              // 预测行**没有笔数**（推算数不出笔数），别显示成「undefined 笔」。
              if (row.count === null || row.count === undefined) {
                return amount + "　（推算）";
              }
              return amount + "　(" + row.count + " 笔)";
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: "#8b93a1" }, grid: { color: "#2b3038" } },
        y: { ticks: { color: "#8b93a1" }, grid: { color: "#2b3038" } },
      },
    },
  });
}

// --- 权限确认 -----------------------------------------------------------

let confirmTimer = null;

function askConfirm(summary) {
  const dialog = $("confirm");
  $("confirm-text").textContent = summary;
  dialog.showModal();
  // 界面这边也要有超时，和后端的 CONFIRM_TIMEOUT 对齐 ——
  // 后端超时之后按钮再点也没用了，不如自己先关掉。
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => dialog.open && dialog.close(), 290000);
}

async function answer(allow) {
  clearTimeout(confirmTimer);
  $("confirm").close();
  try {
    await api(`/api/sessions/${sessionId}/confirm`, { allow });
  } catch (err) {
    console.error("回复确认失败", err);
  }
}

$("allow").onclick = () => answer(true);
$("deny").onclick = () => answer(false);

// --- 发送 ---------------------------------------------------------------

async function send() {
  const text = $("input").value.trim();
  if (!text || busy || !sessionId) return;
  $("input").value = "";
  try {
    await api(`/api/sessions/${sessionId}/messages`, { text });
  } catch (err) {
    setBusy(false);
    // **把内容还回输入框。** 清空是在发请求之前做的，失败时不还回去，用户刚打的
    // 那段就没了 —— 而重试的成本是把它们重新打一遍。放回去之后按一下回车就是重试。
    //
    // 刻意**不做自动重试**：这个 POST 会真的启动一轮 agent（真金白银的 LLM 调用），
    // 而失败时我们不知道对面收到没有 —— 自动重发有可能把一轮变成两轮。
    $("input").value = text;
    (current || bubble("answer")).appendChild(
      el("div", "note bad", "发不出去：" + err.message + "　（内容已放回输入框，回车重试）")
    );
    scroll();
  }
}

$("send").onclick = send;
$("input").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
$("new").onclick = newSession;

// --- 一点极简的 markdown ------------------------------------------------

// 只处理模型实际会用的那几种：表格、标题、加粗、行内代码、代码块。
// 引一个 markdown 库也可以，但那样这个文件就不是「一眼能读完」的了。
function markdown(text) {
  // 引号也要转义 —— 链接的 href 是拼进属性里的，不转的话
  // `[x](http://a/"onmouseover="alert(1))` 能从这个属性里跑出去。
  const esc = (s) => s.replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
  const lines = esc(text).split("\n");
  const out = [];
  let inTable = false, inCode = false;
  // 连续的同类型块要合成一个 —— `- a` 紧跟 `- b` 是一个两元素列表，不是两个
  // 单元素列表（后者渲染出来每个之间都有间距）。
  let block = null;   // null | "ul" | "ol" | "blockquote"

  const closeBlock = () => { if (block) { out.push(`</${block}>`); block = null; } };
  const openBlock = (kind) => { if (block !== kind) { closeBlock(); out.push(`<${kind}>`); block = kind; } };

  for (const raw of lines) {
    if (raw.trim().startsWith("```")) {
      closeBlock();
      out.push(inCode ? "</code></pre>" : "<pre><code>");
      inCode = !inCode;
      continue;
    }
    if (inCode) { out.push(raw); continue; }

    const bullet = raw.match(/^\s*[-*]\s+(.*)$/);
    const numbered = raw.match(/^\s*\d+\.\s+(.*)$/);
    if (bullet || numbered) {
      openBlock(bullet ? "ul" : "ol");
      out.push(`<li>${(bullet || numbered)[1]}</li>`);
      continue;
    }

    // 注意匹配的是 **`&gt;`** 而不是 `>` —— 转义在前面就做过了，这时候 `>` 已经
    // 变成实体了。用 `>` 去匹配会永远匹配不上，而且**不报错**：引用会渲染成一个
    // 普通的、以 `&gt;` 开头的段落。
    const quote = raw.match(/^\s*&gt;\s?(.*)$/);
    if (quote) {
      openBlock("blockquote");
      out.push(`<div>${quote[1]}</div>`);
      continue;
    }

    closeBlock();

    const isRow = /^\s*\|.*\|\s*$/.test(raw);
    if (isRow && /^\s*\|[\s:|-]+\|\s*$/.test(raw)) continue;  // 分隔行
    if (isRow !== inTable) { out.push(isRow ? "<table>" : "</table>"); inTable = isRow; }
    if (isRow) {
      const cells = raw.trim().slice(1, -1).split("|")
        .map((c) => `<td>${c.trim()}</td>`).join("");
      out.push(`<tr>${cells}</tr>`);
      continue;
    }
    const head = raw.match(/^(#{1,4})\s+(.*)$/);
    if (head) { const n = head[1].length + 2; out.push(`<h${n}>${head[2]}</h${n}>`); continue; }
    out.push(raw.trim() === "" ? "" : `<div>${raw}</div>`);
  }
  closeBlock();
  if (inTable) out.push("</table>");
  if (inCode) out.push("</code></pre>");

  // 行内格式在拼完之后统一做。顺序有讲究：
  //   · `**粗体**` 必须在 `*斜体*` 前面 —— 反过来会把粗体的星号吃掉
  //   · 代码必须在斜体前面 —— 代码里的 `*` 是内容，不是标记
  return out.join("\n")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, label, href) => {
      // 只放行 http/https。`[点我](javascript:...)` 是个真的 XSS 入口，而这个
      // 页面会把模型输出直接插进 DOM —— 模型输出是数据，不是可信代码。
      if (!/^https?:\/\//i.test(href)) return label;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    })
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

// 不是 newSession() —— 先试着接回上次那个会话，接不回去才开新的。
boot();
</script>
</body>
</html>
