[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只打包 fa —— data/ 是脚本目录（`python -m data.generate`），不是要装的东西。
# 测试从仓库根跑，靠下面的 pythonpath 找到它。
[tool.setuptools]
packages = ["fa", "fa.tools"]

[project]
name = "finance-agent"
version = "0.1.0"
description = "个人财务分析 agent —— 自然语言问题进去，可复现的数字出来"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
# 第八天的 RAGAS 单独列 —— 它会带进 datasets / pyarrow / numpy / pandas
# 一串重依赖，而日常开发和 CI 完全用不到。
#
# **`langchain-community` 的上限不是可选的。** ragas 0.4.3 在模块顶层 import 了
# `langchain_community.chat_models.vertexai`，但它声明依赖时没给
# `langchain-community` 设上限 —— 装最新的 0.4.x 会直接 import 失败：
#
#     ModuleNotFoundError: No module named 'langchain_community.chat_models.vertexai'
#
# 0.3.31 还带着那个模块，而且不会连带降级 langchain-core / langchain-openai。
# 这是 ragas 的打包问题，不是我们的；等它修了就能去掉这个上限。
eval = [
    "ragas",
    "langchain-community<0.4",
]
# 第九天的 Web 前端单独列 —— CI 不需要它（前端代码在这个项目里没有测试，
# 而后端那部分只用标准库 + FastAPI 的数据结构）。
web = [
    "fastapi",
    "uvicorn",
]
# 第十一天的向量检索单独列 —— **chromadb 不能进 base `dependencies`。**
#
# CI 装的是 `.[dev]`，而它会连带装 base。一条 base 依赖就会把 chromadb 拖进
# 每一次 CI 运行，为了一个 CI 根本走不到的代码路径：向量检索要 API key 和网络，
# 而 CI 两样都没有（ci.yml 里写明了测试全部离线、LLM 调用全部打桩）。
# 第九天已经吃过一次同类的亏 —— ragas 顺着 import 链被拖进测试，200 多兆。
#
# 而且 Windows 上装 chromadb 有可能失败，CI 是 Ubuntu，抓不到那种问题。
# 待在 extra 里，装不上的人只是没有向量检索，程序照常跑。
#
# 它只列一个依赖是有意的：embedding 和重排都走 HTTP，客户端复用已经装了的
# `openai` / `httpx`；向量库以外的东西（递归切分、余弦、RRF）全是标准库。
rag = [
    "chromadb",
]
# 检索结果缓存（embedding + rerank 两层）。单独列，理由和上面两个一样。
#
# **不装也能跑** —— 没装 redis 客户端时退回进程内的 dict 缓存，那在单进程里
# 已经够用。所以这个 extra 带来的只是「跨进程共享」那一件事，
# 不该让不需要它的人付安装成本。
#
# `fakeredis` 也在里面：它是纯 Python 的 Redis 实现，**同一套客户端 API**，
# 用来在没有服务端的机器上验客户端代码。CI 装 `.[dev]`，所以那几条测试会跳过
# —— 缓存**逻辑**由 `MemoryCache` 覆盖（那个不需要任何依赖），Redis 只覆盖
# 往返那一条。
cache = [
    "redis",
    "fakeredis",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
