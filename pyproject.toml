[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只打包 fa —— data/ 是脚本目录（`python -m data.generate`），不是要装的东西。
# 测试从仓库根跑，靠下面的 pythonpath 找到它。
[tool.setuptools]
packages = ["fa", "fa.tools"]

[project]
name = "finance-agent"
version = "0.1.0"
description = "个人财务分析 agent —— 自然语言问题进去，可复现的数字出来"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
# 第八天的 RAGAS 单独列 —— 它会带进 datasets / pyarrow / numpy / pandas
# 一串重依赖，而日常开发和 CI 完全用不到。
#
# **`langchain-community` 的上限不是可选的。** ragas 0.4.3 在模块顶层 import 了
# `langchain_community.chat_models.vertexai`，但它声明依赖时没给
# `langchain-community` 设上限 —— 装最新的 0.4.x 会直接 import 失败：
#
#     ModuleNotFoundError: No module named 'langchain_community.chat_models.vertexai'
#
# 0.3.31 还带着那个模块，而且不会连带降级 langchain-core / langchain-openai。
# 这是 ragas 的打包问题，不是我们的；等它修了就能去掉这个上限。
eval = [
    "ragas",
    "langchain-community<0.4",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
